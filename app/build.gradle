plugins { id 'com.android.application' }

android {
    namespace 'com.tizkorot.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tizkorot.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('tizkorot.jks')
            storePassword 'tizkorot123'
            keyAlias 'tizkorot'
            keyPassword 'tizkorot123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
